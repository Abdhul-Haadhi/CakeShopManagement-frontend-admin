<div class="container-bar">
    <!-- Toolbar Section -->
    <mat-toolbar class="heading-bar mat-elevation-z2">
        <span class="heading-text">Available Permissions</span>
        <span class="example-spacer"></span>

        <!-- Add Button (Shows when form is hidden) -->
        <!-- <button class="action-btn header-add-btn" mat-raised-button color="accent">
            <mat-icon>add</mat-icon>Add Permission
        </button> -->

        <!-- Form Actions (Shows when form is active) -->
        <!-- <ng-container *ngIf="showForm">
            <button mat-raised-button color="primary" class="action-btn" (click)="savePermission()"
                [disabled]="permissionForm.invalid">
                <mat-icon>save</mat-icon>{{isEditMode ? 'Update' : 'Save'}}
            </button>
            <button mat-raised-button type="button" color="warn" class="action-btn cancel-btn"
                (click)="cancelEdit(); showForm = false">
                <mat-icon>close</mat-icon>Cancel
            </button>
        </ng-container> -->
    </mat-toolbar>

    <!-- Form Section -->
    <div *ngIf="showForm" class="form-section card-wrapper mat-elevation-z3 animate-fade-in">
        <div class="container">
            <div class="section-header">
                <mat-icon color="primary">verified_user</mat-icon>
                <h3>Permission Registration Form</h3>
            </div>

            <form [formGroup]="permissionForm">
                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Permission Name</mat-label>
                    <input matInput type="text" placeholder="Ex: DASHBOARD_MANAGEMENT"
                        formControlName="permissionName" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Description</mat-label>
                    <input matInput type="text" placeholder="Description" formControlName="description" />
                </mat-form-field>
            </form>
        </div>
    </div>

    <!-- Table Section -->
    <div class="table-section card-wrapper mat-elevation-z3">
        <div class="table-header-row">
            <div class="table-title">
                <mat-icon color="primary">security</mat-icon>
                <h3>Registered Permissions</h3>
            </div>

            <div class="refresh-filter-section">
                <!-- Ensure refreshData() is in your TS file -->
                <button mat-icon-button class="refresh-btn-ui" (click)="refreshData()" matTooltip="Refresh Permissions">
                    <mat-icon>refresh</mat-icon>
                </button>
                <mat-form-field appearance="outline" class="filter">
                    <mat-label>Search Permissions...</mat-label>
                    <!-- Ensure applyFilter() is in your TS file -->
                    <input matInput (keyup)="applyFilter($event)" placeholder="Ex: User Management..." #input />
                    <mat-icon matPrefix color="primary">search</mat-icon>
                </mat-form-field>
            </div>
        </div>

        <div class="responsive-table-container">
            <table mat-table [dataSource]="permissions" matSort>

                <!-- ID Column -->
                <ng-container matColumnDef="permissionId">
                    <th mat-header-cell *matHeaderCellDef> ID </th>
                    <td mat-cell *matCellDef="let p">
                        <span class="sku-text">{{p.permissionId}}</span>
                    </td>
                </ng-container>

                <!-- Permission Name Column -->
                <ng-container matColumnDef="permissionName">
                    <th mat-header-cell *matHeaderCellDef> Name </th>
                    <td mat-cell *matCellDef="let p">
                        <span class="bold-text">{{p.permissionName}}</span>
                    </td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> Description </th>
                    <td mat-cell *matCellDef="let p"> {{p.description}} </td>
                </ng-container>

                <!-- Actions Column -->
                <!-- <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let p">
                        <div class="action-buttons-container">
                            <button mat-icon-button class="action-icon-btn edit-icon"
                                (click)="editPermission(p); showForm = true" matTooltip="Edit Permission">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button class="action-icon-btn delete-icon"
                                (click)="deletePermission(p.permissionId)" matTooltip="Delete Permission">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container> -->

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hoverable-row"></tr>
            </table>
        </div>

        <!-- Paginator -->
        <mat-paginator [pageSizeOptions]="[10, 20, 25, 100]" aria-label="Select page of permissions"></mat-paginator>
    </div>
</div>
