<h2 mat-dialog-title>
    Add Stock
</h2>

<mat-dialog-content>

    <p>
        <strong>Item :</strong>
        {{item.itemName}}
    </p>
    <p>
        <strong>Current Quantity :</strong>
        {{item.currentQuantity + item.unit}}
    </p>

    <form [formGroup]="stockForm">

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Batch Number</mat-label>
            <input matInput formControlName="batchNumber" readonly>
            <mat-hint>Automatically generated</mat-hint>
        </mat-form-field>

        <!-- <mat-form-field appearance="outline" class="full-width">
            <mat-label>Current Quantity</mat-label>
            <input matInput formControlName="currentQuantity" readonly>
        </mat-form-field> -->

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" step="0.01" min="0" formControlName="quantityAdded">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Expiry Date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="expiryDate" [min]="minDate">
            <mat-datepicker-toggle matSuffix [for]="picker">
            </mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button mat-button mat-dialog-close>
        Cancel
    </button>
    <button mat-raised-button color="primary" (click)="saveStock()" [disabled]="this.stockForm.invalid">
        Save
    </button>

</mat-dialog-actions>
